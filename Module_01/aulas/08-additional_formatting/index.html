<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Additional Formatting</title>
</head>
<body>
    <h1>Additional Formattings</h1>
    <hr>

    <h2>Text Mark</h2>
    <p> Hello, <mark>World!</mark> (TAG MARK) </p>
    <hr>

    <h2>Big and Small Text</h2>
    <p><big>Hello,</big> <small>World!</small> (TAGS BIG AND SMALL)</p>
    <hr>

    <h2>Del and Insert Text</h2>
    <p><del>Hello,</del><ins> World!</ins> (TAGS DEL AND INS)</p>
    <hr>

    <h2>Subscript and Superscript</h2>
    <p>H<sub>2</sub>O and E=mc<sup>2</sup> (TAGS SUB AND SUP)</p>

</body>
</html>
